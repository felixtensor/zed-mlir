id = "mlir-tablegen"
name = "MLIR"
description = "MLIR, TableGen, and PDLL support."
version = "0.6.3"
schema_version = 1
authors = [
    "felixtensor <xubuyun@outlook.com>",
    "feichai0017 <songguocheng348@gmail.com>",
]
repository = "https://github.com/felixtensor/zed-mlir"

[grammars.mlir]
repository = "https://github.com/felixtensor/tree-sitter-mlir"
commit = "8c207240107c4b1411e03a21f852813150eecacd"

[grammars.tablegen]
repository = "https://github.com/felixtensor/tree-sitter-tablegen"
commit = "2289db09d737da60407e8a8e1bfa2997c54d10b4"

[grammars.pdll]
repository = "https://github.com/felixtensor/tree-sitter-pdll"
commit = "be2e15a7a17dcd4b24ab5e757539a4efeaa1de07"

[language_servers.mlir-lsp-server]
name = "mlir-lsp-server"
languages = ["MLIR"]

[language_servers.mlir-pdll-lsp-server]
name = "mlir-pdll-lsp-server"
languages = ["PDLL"]

[language_servers.tblgen-lsp-server]
name = "tblgen-lsp-server"
languages = ["TableGen"]
